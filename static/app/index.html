<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f17">
  <title>Stake Code Claimer</title>
  <!-- Telegram Mini App SDK (required; allowed by CSP script-src) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app/static/style.css?v=sc7">
</head>
<body>
  <!-- Icon sprite (hidden via class, not inline style, to keep CSP strict) -->
  <svg aria-hidden="true" class="hidden" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 6h16a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4V7a1 1 0 0 1 1-1z"/><path d="M14 6v12"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M6 21v-6M12 21V8M18 21v-10"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h11v4h3a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M16 12h2"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M18 5l2 2M15 8l2 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
  </svg>

  <div id="app">
    <header id="topbar">
      <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Back">‹</button>
      <div id="title">Stake Code Claimer</div>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh">⟳</button>
      <div id="headerbar"></div>
    </header>

    <main id="view" aria-live="polite" aria-busy="false" tabindex="-1">
      <div class="loader"><div class="spinner"></div></div>
    </main>

    <div id="ctabar" class="hidden"></div>

    <nav id="bottomnav" role="navigation" aria-label="Main"></nav>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>

  <script src="/app/static/app.js?v=sc7"></script>
</body>
</html>
